<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:1200px;overflow:hidden}
body{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0C0C1C;font-family:"Fira Sans",sans-serif;color:#fff;text-align:center}
.bg{position:absolute;inset:0}
.bg::before{content:"";position:absolute;inset:0;background:url("../img/hero-soldador.jpg") 30% 50%/cover no-repeat;filter:grayscale(1) brightness(.55)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,14,34,.9) 0%,rgba(18,18,46,.78) 45%,rgba(24,24,60,.86) 100%)}
.frame{position:absolute;inset:46px;border:1px solid rgba(201,171,120,.45)}
img{position:relative;width:330px}
.line{position:relative;width:60px;height:1px;background:#C9AB78;margin:60px 0 36px}
p{position:relative;margin:0;font-weight:600;font-size:30px;letter-spacing:.24em;text-transform:uppercase;color:#DCC08C;line-height:1.7}
</style></head><body>
<div class="bg"></div><div class="frame"></div>
<img src="../logo.png" alt="">
<div class="line"></div>
<p>Accidentes de trabajo · ART<br>Enfermedades profesionales</p>
</body></html>
